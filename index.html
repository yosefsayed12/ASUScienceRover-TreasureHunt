<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Treasure Hunt | جوالة علوم عين شمس</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
    <link rel="icon" href="images/SCOUT.png" type="image/png">
</head>

<body>

    <main class="game-container">

        <!-- Header -->
        <header class="header">

            <div class="logo">
                <img src="images/SCOUT.png" alt="clan-logo">
            </div>

            <div>
                <p class="brand">جوالة كلية العلوم</p>
                <p class="game-name">QR Treasure Hunt</p>
            </div>

        </header>


        <!-- Progress -->
        <div class="progress-section">

            <div class="progress-info">
                <span id="progressText">المحطة 1 من 7</span>
                <span id="stationType">داخل الكلية</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

        </div>


        <!-- Main Card -->
        <section class="station-card" id="stationCard">

            <div class="station-number" id="stationNumber">
                المحطة 1
            </div>

            <h1 id="stationTitle">
                أول خيط
            </h1>

            <div class="intro" id="stationIntro">
            </div>


            <!-- Riddle -->
            <div class="riddle-box" id="riddleBox">

                <div class="riddle-title">
                    <span>🧩</span>
                    <span>الفزورة</span>
                </div>

                <p id="riddle">
                </p>

            </div>


            <!-- Final message -->
            <div class="final-box" id="finalBox">

                <div class="final-icon">
                    <img src="images/SCOUT.png" alt="clan-logo">
                </div>

                <p>
                    ⚜️ اتبع الأثر الاخير الي المكان الذي يجمع كل الحكايات
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>تنمية • خدمة المجتمع • تطوير</p>
            <span><a href="https://web.facebook.com/scienceseascouts">جوالة كلية العلوم - جامعة عين شمس</a></span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
